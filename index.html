<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI Viral Content Factory ULTRA PRO</title>

<style>

body{
font-family:Arial;
background:linear-gradient(135deg,#020617,#0f172a);
color:white;
padding:30px
}

.container{
max-width:1100px;
margin:auto
}

.card{
background:#111827;
padding:24px;
border-radius:16px;
margin-bottom:20px
}

label{
display:block;
margin-top:12px;
font-weight:bold
}

select,button{
width:100%;
padding:10px;
margin-top:8px;
border-radius:8px;
border:none
}

select{
background:#1e293b;
color:white
}

button{
background:#2563eb;
color:white;
cursor:pointer
}

textarea{
width:100%;
height:350px;
margin-top:10px;
background:#020617;
color:#22c55e;
border:none;
padding:10px;
border-radius:10px
}

</style>
</head>


<body>

<div class="container">

<h1>AI Viral Content Factory ULTRA PRO</h1>

<div class="card">

<label>Supermodel Character</label>
<select id="model"></select>


<label>Outfit Style</label>
<select id="outfit"></select>


<label>Luxury Brand</label>
<select id="brand">
<option value="random">Random Brand</option>
</select>


<label>Accessories</label>
<select id="accessories">
<option>none</option>
<option>luxury sunglasses</option>
<option>designer handbag</option>
<option>diamond necklace</option>
<option>luxury watch</option>
</select>


<label>Supermodel Pose</label>
<select id="pose">
<option value="random">Random Pose</option>
</select>


<label>Luxury Location</label>
<select id="location">
<option value="random">Random Location</option>
</select>


<label>Supercar</label>
<select id="car">
<option>none</option>
<option>Lamborghini Aventador</option>
<option>Ferrari SF90</option>
<option>Bugatti Chiron</option>
<option>Rolls Royce Phantom</option>
<option>McLaren P1</option>
<option>Koenigsegg Jesko</option>
</select>


<label>Camera</label>
<select id="camera">
<option>cinematic tracking shot</option>
<option>influencer selfie camera</option>
<option>drone cinematic shot</option>
</select>


<label>Lighting</label>
<select id="lighting">
<option>golden sunset lighting</option>
<option>luxury daylight</option>
<option>soft city night lights</option>
</select>


<button onclick="generatePrompt()">Generate Prompt</button>

</div>


<div class="card">

<label>Generated Prompt</label>
<textarea id="output"></textarea>

<button onclick="copy()">Copy</button>

</div>

</div>


<script>

const models=[

{name:"Sophia Rossi",country:"Italy"},
{name:"Emma Johansson",country:"Sweden"},
{name:"Isabella Martinez",country:"Spain"},
{name:"Ava Thompson",country:"USA"},
{name:"Mia Dubois",country:"France"},
{name:"Lena Schneider",country:"Germany"},
{name:"Yuki Tanaka",country:"Japan"},
{name:"Aria Rahimi",country:"UAE"},
{name:"Soo Min Park",country:"South Korea"},
{name:"Camila Silva",country:"Brazil"},
{name:"Anya Petrova",country:"Russia"},
{name:"Nina Novak",country:"Poland"},
{name:"Clara Fischer",country:"Austria"},
{name:"Lara Costa",country:"Portugal"},
{name:"Zara Khan",country:"Pakistan"},
{name:"Sara Andersson",country:"Norway"},
{name:"Emily Clark",country:"Canada"},
{name:"Valeria Romano",country:"Italy"},
{name:"Daria Ivanova",country:"Ukraine"},
{name:"Keiko Sato",country:"Japan"}

]


const outfits=[

"luxury summer dress",
"elegant bodycon evening dress",
"designer bikini with luxury beach cover-up",
"luxury silk robe outfit",
"stylish mini dress",
"fashion influencer crop top with mini skirt",
"luxury resort wear outfit",
"high fashion beach outfit",
"luxury influencer casual summer outfit",
"designer swimsuit with elegant wrap skirt"

]


const brands=["Gucci","Louis Vuitton","Prada","Chanel","Dior","Versace","Balenciaga"]


const poses=[
"walking like a runway supermodel",
"posing with hand on hip",
"luxury influencer selfie pose",
"leaning against balcony",
"slow motion fashion walk"
]


const locations=[

"luxury penthouse bedroom",
"luxury bedroom with panoramic city view",
"glass balcony overlooking city skyline",
"luxury balcony at sunset",
"Dubai Marina skyline",
"Beverly Hills luxury street",
"Monaco harbor with yachts"

]


function fillSelect(id,data){

const select=document.getElementById(id)

data.forEach(v=>{

let opt=document.createElement("option")

if(typeof v=="object"){
opt.value=v.name+" from "+v.country
opt.textContent=v.name+" ("+v.country+")"
}
else{
opt.value=v
opt.textContent=v
}

select.appendChild(opt)

})

}


fillSelect("model",models)
fillSelect("outfit",outfits)
fillSelect("brand",brands)
fillSelect("pose",poses)
fillSelect("location",locations)



function random(arr){
return arr[Math.floor(Math.random()*arr.length)]
}


function generatePrompt(){

let brand=document.getElementById("brand").value
if(brand=="random") brand=random(brands)

let pose=document.getElementById("pose").value
if(pose=="random") pose=random(poses)

let location=document.getElementById("location").value
if(location=="random") location=random(locations)


const model=document.getElementById("model").value
const outfit=document.getElementById("outfit").value
const accessories=document.getElementById("accessories").value
const car=document.getElementById("car").value
const camera=document.getElementById("camera").value
const lighting=document.getElementById("lighting").value


let prompt=`Cinematic luxury influencer video of ${model}, wearing ${outfit} from ${brand}, ${pose}. Accessories: ${accessories}. Scene set in ${location}.`

if(car!="none"){
prompt+=` A ${car} appears in the background.`
}

prompt+=` Camera style: ${camera}. Lighting: ${lighting}. Ultra realistic luxury lifestyle.`


document.getElementById("output").value=prompt

}


function copy(){

navigator.clipboard.writeText(
document.getElementById("output").value
)

alert("Copied")

}

</script>

</body>
</html>
