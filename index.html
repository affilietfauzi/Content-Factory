<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI Viral Content Factory ULTRA PRO</title>

<style>

body{
font-family:Inter,Arial;
background:linear-gradient(135deg,#020617,#0f172a);
color:#e5e7eb;
margin:0;
padding:30px
}

.container{
max-width:1300px;
margin:auto
}

h1{
font-size:34px;
margin-bottom:6px
}

.card{
background:#111827;
padding:24px;
border-radius:18px;
margin-bottom:20px;
box-shadow:0 25px 50px rgba(0,0,0,0.6)
}

label{
display:block;
margin-top:12px;
font-weight:bold
}

select,button,input{
width:100%;
padding:10px;
margin-top:8px;
border-radius:10px;
border:none;
font-size:14px
}

select,input{
background:#1e293b;
color:white
}

button{
cursor:pointer;
background:linear-gradient(90deg,#2563eb,#9333ea);
color:white
}

.random{background:#f59e0b}
.copy{background:#10b981}
.export{background:#0ea5e9}

textarea{
width:100%;
height:450px;
margin-top:10px;
background:#020617;
color:#22c55e;
border-radius:10px;
padding:12px;
border:none;
font-family:monospace
}

.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:20px
}

</style>
</head>


<body>

<div class="container">

<h1>AI Viral Content Factory ULTRA PRO</h1>
<p>Generate viral luxury influencer scenes for AI video generation.</p>


<div class="grid">

<div class="card">

<label>Top Clothing</label>
<select id="top">
<option>a designer crop top</option>
<option>a luxury silk blouse</option>
<option>a high fashion blazer</option>
<option>a luxury streetwear hoodie</option>
<option>a glamorous evening top</option>
<option>a luxury fashion jacket</option>
</select>


<label>Bottom Clothing</label>
<select id="bottom">
<option>designer denim shorts</option>
<option>luxury leather pants</option>
<option>high waist fashion jeans</option>
<option>a stylish mini skirt</option>
<option>luxury evening skirt</option>
<option>luxury tailored trousers</option>
</select>


<label>Luxury Brand</label>
<select id="brand"></select>

<label>Accessories</label>
<select id="accessories">
<option>luxury sunglasses</option>
<option>a designer handbag</option>
<option>a luxury diamond necklace</option>
<option>a premium luxury watch</option>
<option>designer handbag and sunglasses</option>
<option>none</option>
</select>


<label>Supermodel Pose</label>
<select id="pose"></select>


<label>Expression</label>
<select id="expression">
<option>smiling confidently</option>
<option>laughing happily</option>
<option>looking surprised</option>
<option>posing stylishly</option>
<option>luxury influencer confident face</option>
</select>


<label>Luxury Location</label>
<select id="location"></select>

<label>Supercar</label>
<select id="car"></select>

</div>


<div class="card">

<label>Camera Movement</label>
<select id="camera">
<option>a handheld influencer selfie camera</option>
<option>a smooth cinematic tracking shot</option>
<option>a dramatic cinematic orbit camera</option>
<option>a luxury commercial camera</option>
<option>a drone cinematic shot</option>
<option>a slow motion fashion camera</option>
</select>


<label>Shot Composition</label>
<select id="shot">
<option>close-up influencer selfie</option>
<option>medium influencer vlog</option>
<option>wide cinematic luxury shot</option>
<option>epic drone wide shot</option>
</select>


<label>Lighting</label>
<select id="lighting">
<option>golden sunset lighting</option>
<option>bright luxury commercial lighting</option>
<option>soft city night lights</option>
<option>bright luxury daylight</option>
<option>dramatic neon luxury lighting</option>
</select>


<label>Video Duration</label>
<select id="duration">
<option>5</option>
<option>8</option>
<option>12</option>
<option>15</option>
</select>


<label>Visual Style</label>
<select id="style">
<option>luxury influencer cinematic</option>
<option>high end luxury commercial</option>
<option>fashion influencer vlog</option>
<option>luxury documentary style</option>
</select>


<label>Viral Hook</label>
<select id="hook"></select>


<button onclick="generateJSON()">Generate Prompt</button>
<button class="random" onclick="autoScene()">🎲 Auto Scene</button>
<button onclick="generateMultiple()">Generate 10 Prompts</button>

</div>

</div>


<div class="card">

<label>Generated Prompt JSON</label>
<textarea id="output"></textarea>

<button class="copy" onclick="copyJSON()">Copy</button>
<button class="export" onclick="exportJSON()">Export JSON</button>
<button class="export" onclick="exportTXT()">Export TXT</button>

</div>


</div>



<script>


const brands=[]
for(let i=1;i<=1000;i++){
brands.push("Luxury Brand "+i)
}

const poses=[]
for(let i=1;i<=250;i++){
poses.push("high fashion supermodel pose "+i)
}

const hooks=[]
for(let i=1;i<=150;i++){
hooks.push("viral luxury lifestyle hook "+i)
}

const cars=[
"Lamborghini Aventador","Ferrari SF90","Bugatti Chiron","McLaren P1","Rolls Royce Phantom",
"Rolls Royce Cullinan","Bentley Continental GT","Koenigsegg Jesko","Pagani Huayra",
"Porsche 911 Turbo","Aston Martin Valkyrie","Rimac Nevera"
]

const locations=[]
for(let i=1;i<=200;i++){
locations.push("luxury influencer location "+i)
}



function fillSelect(id,data){

const select=document.getElementById(id)

data.forEach(v=>{
let o=document.createElement("option")
o.value=v
o.textContent=v
select.appendChild(o)
})

}

fillSelect("brand",brands)
fillSelect("pose",poses)
fillSelect("hook",hooks)
fillSelect("car",cars)
fillSelect("location",locations)



function viralScore(){

let score=Math.floor(Math.random()*30)+70
return score

}


function optimizePrompt(prompt){

const extras=[

"ultra realistic",
"cinematic lighting",
"luxury influencer aesthetic",
"high fashion editorial",
"4K ultra detailed",
"professional depth of field",
"viral TikTok aesthetic",
"cinematic luxury atmosphere"

]

return prompt+", "+extras[Math.floor(Math.random()*extras.length)]

}



function generateJSON(){

const hook=document.getElementById("hook").value
const pose=document.getElementById("pose").value
const brand=document.getElementById("brand").value
const top=document.getElementById("top").value
const bottom=document.getElementById("bottom").value
const accessories=document.getElementById("accessories").value
const expression=document.getElementById("expression").value
const location=document.getElementById("location").value
const car=document.getElementById("car").value
const camera=document.getElementById("camera").value
const shot=document.getElementById("shot").value
const lighting=document.getElementById("lighting").value
const duration=document.getElementById("duration").value
const style=document.getElementById("style").value


let prompt=`${hook}. Cinematic ${shot} video of a luxury influencer ${expression} ${pose}, wearing ${top} and ${bottom}, showing ${brand} and ${accessories}. Scene set in ${location}. A ${car} appears prominently in the background. Camera movement ${camera}. Lighting ${lighting}.`

prompt=optimizePrompt(prompt)



const json={

metadata:{
tool:"AI Viral Content Factory ULTRA PRO"
},

viral_hook:hook,

viral_score:viralScore(),

video_prompt:prompt,

technical_specs:{
resolution:"4K",
aspect_ratio:"9:16",
fps:"30",
duration_seconds:Number(duration),
style:style
}

}

document.getElementById("output").value=
JSON.stringify(json,null,2)

}



function autoScene(){

const selects=document.querySelectorAll("select")

selects.forEach(s=>{
s.selectedIndex=Math.floor(Math.random()*s.options.length)
})

generateJSON()

}



function generateMultiple(){

let arr=[]

for(let i=0;i<10;i++){

autoScene()

arr.push(JSON.parse(document.getElementById("output").value))

}

document.getElementById("output").value=
JSON.stringify(arr,null,2)

}



function copyJSON(){

const text=document.getElementById("output").value

navigator.clipboard.writeText(text)

alert("Copied")

}



function downloadFile(content,name){

const blob=new Blob([content],{type:"text/plain"})

const a=document.createElement("a")

a.href=URL.createObjectURL(blob)

a.download=name

a.click()

}



function exportJSON(){

downloadFile(document.getElementById("output").value,"viral_prompt.json")

}

function exportTXT(){

downloadFile(document.getElementById("output").value,"viral_prompt.txt")

}


</script>

</body>
</html>
