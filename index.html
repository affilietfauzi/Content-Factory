<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI Influencer Generator PRO</title>

<style>

body{
background:#0f172a;
color:white;
font-family:Arial;
margin:0;
padding:30px;
}

.container{
max-width:1200px;
margin:auto;
}

.card{
background:#1e293b;
padding:20px;
border-radius:12px;
margin-bottom:20px;
}

.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:20px;
}

select,button{
width:100%;
padding:10px;
margin-top:8px;
border-radius:8px;
border:none;
}

textarea{
width:100%;
height:350px;
background:black;
color:#22c55e;
font-family:monospace;
padding:15px;
border-radius:10px;
border:none;
}

button{
background:#2563eb;
color:white;
cursor:pointer;
}

</style>

</head>


<body>

<div class="container">

<h1>AI Influencer Prompt Generator PRO</h1>

<div class="grid">

<div class="card">

<label>Influencer Character</label>
<select id="character"></select>

<label>Outfit Style</label>
<select id="outfit"></select>

<label>Luxury Brand</label>
<select id="brand"></select>

<label>Pose</label>
<select id="pose"></select>

</div>


<div class="card">

<label>Location</label>
<select id="location"></select>

<label>Supercar</label>
<select id="car"></select>

<label>Hook</label>
<select id="hook"></select>

<button onclick="generateJSON()">Generate JSON</button>

</div>

</div>


<div class="card">

<textarea id="output"></textarea>

</div>

</div>


<script src="db/characters.js"></script>
<script src="db/brands.js"></script>
<script src="db/poses.js"></script>
<script src="db/locations.js"></script>
<script src="db/cars.js"></script>
<script src="db/outfits.js"></script>
<script src="db/hooks.js"></script>

<script>

function fillSelect(id,data){

const select=document.getElementById(id)

data.forEach(v=>{

let opt=document.createElement("option")

opt.value=v.name || v
opt.textContent=v.name || v

select.appendChild(opt)

})

}

fillSelect("brand",brands)
fillSelect("pose",poses)
fillSelect("location",locations)
fillSelect("car",cars)
fillSelect("outfit",outfits)
fillSelect("hook",hooks)


characters.forEach(c=>{

let opt=document.createElement("option")

opt.value=c.name
opt.textContent=c.name+" ("+c.country+")"

document.getElementById("character").appendChild(opt)

})


function getCharacter(name){

return characters.find(c=>c.name===name)

}


function generateJSON(){

const characterName=document.getElementById("character").value

const char=getCharacter(characterName)

const brand=document.getElementById("brand").value
const pose=document.getElementById("pose").value
const location=document.getElementById("location").value
const car=document.getElementById("car").value
const outfit=document.getElementById("outfit").value
const hook=document.getElementById("hook").value


const result={

character:{
name:char.name,
country:char.country,
hair_color:char.hair_color,
hair_style:char.hair_style,
skin_tone:char.skin_tone,
eye_color:char.eye_color,
face_shape:char.face_shape,
height:char.height,
body_type:char.body_type,
makeup_style:char.makeup_style,
niche:char.niche
},

scene:{
location:location,
pose:pose,
supercar:car
},

fashion:{
outfit:outfit,
brand:brand
},

hook:hook,

prompt:

`${hook}. ${char.name}, a ${char.country} influencer with ${char.hair_color} ${char.hair_style}, ${char.skin_tone}, ${char.eye_color}, ${char.face_shape}. Wearing ${outfit} from ${brand}. Pose: ${pose}. Scene at ${location}. ${car !== "none" ? "A "+car+" parked nearby." : ""} Cinematic ultra realistic influencer video.`

}


document.getElementById("output").value=

JSON.stringify(result,null,2)

}

</script>

</body>

</html>
